name: Compilar APK Mi Negocio

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.28.3" supabase reportlab

      - name: Compilar APK
        run: |
          # --split-per-abi genera un APK por arquitectura (mas liviano).
          # Para tu telefono instala el que termina en arm64-v8a.
          # Opcional (verifica con `flet build -h` si tu version los acepta):
          #   --compile-app --compile-packages --cleanup-app --cleanup-packages
          flet build apk --module-name mi_negocio --split-per-abi

      - name: Subir archivos APK listos para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Mi_Negocio_APK
          path: build/apk/*.apk
